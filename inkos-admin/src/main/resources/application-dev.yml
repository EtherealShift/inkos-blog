# ============================================================================
# dev（默认）：连本机 MySQL 8 开发
#
#   * 建表：启动时执行 db/schema.sql（CREATE TABLE IF NOT EXISTS，可反复执行）。
#   * 种子数据：首次启动灌入（已有 admin 用户时自动跳过），见 DevDataInitializer。
#   * 开发库的表结构改动，直接改 schema.sql 后重建库即可：
#       DROP DATABASE inkos; CREATE DATABASE inkos DEFAULT CHARACTER SET utf8mb4;
#
#   连接信息在 application.yml 里统一配置，默认 127.0.0.1:3306/inkos、用户 root。
#   口令请放 application-local.yml（已 gitignore），或通过环境变量传入：
#       DB_PASSWORD=xxx ./mvnw -pl inkos-admin -am spring-boot:run
# ============================================================================
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false

logging:
  level:
    com.inkos: debug
    # 打开可看到 MyBatis-Plus 生成的 SQL
    com.inkos.system.mapper: debug
    com.inkos.content.mapper: debug
