# ============================================================================
# dev（默认）：连本机 MySQL 8 开发
#
#   * 建表：启动时执行 db/schema.sql（CREATE TABLE IF NOT EXISTS，可反复执行）。
#   * 种子数据：首次启动灌入（已有 admin 用户时自动跳过），见 DevDataInitializer。
#   * 首屏主题字段：启动时执行幂等 hero-copy-upgrade.sql，保留已有内容。
#   * 已有库使用增量升级脚本；不需要重建数据库。
#
#   连接信息在 application.yml 里统一配置，默认 127.0.0.1:3306/inkos、用户 root。
#   口令请放 application-local.yml（已 gitignore），或通过环境变量传入：
#       DB_PASSWORD=xxx ./mvnw -pl inkos-admin -am spring-boot:run
# ============================================================================
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/hero-copy-upgrade.sql
      encoding: UTF-8
      continue-on-error: false

inkos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoint:
    health:
      # 开发环境展开组件详情：一眼能看到 MySQL、Redis 各自是否连上
      show-details: always

logging:
  level:
    com.inkos: debug
    # 打开可看到 MyBatis-Plus 生成的 SQL
    com.inkos.system.mapper: debug
    com.inkos.content.mapper: debug
