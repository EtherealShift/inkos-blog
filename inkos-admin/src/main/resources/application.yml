server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      # charset 默认就是 UTF-8、enabled 默认就是 true，两者无需声明。
      # force 才是非默认项：强制请求与响应都按 UTF-8 处理。
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

spring:
  application:
    name: inkos-blog
  profiles:
    active: dev
  # 个人数据库口令等本地敏感配置。文件不存在时静默跳过，因此可以安全地留在 .gitignore 里。
  config:
    import: optional:classpath:application-local.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      # JDK 21+ 虚拟线程：下游 HTTP 调用这类阻塞等待不再占用平台线程
      enabled: true
  jackson:
    default-property-inclusion: non_null
    # 不声明 date-format / time-zone：这两个只作用于 java.util.Date / Calendar 系类型，
    # 而本项目统一使用 LocalDateTime / LocalDate，由 JacksonConfig 的模块显式格式化。
  # 全部 profile 统一使用 MySQL 8。连接信息一律由环境变量驱动，
  # 仓库里不存放任何真实口令（口令走 application-local.yml 或 DB_PASSWORD）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:inkos}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # 连接池不是越大越好：MySQL 的瓶颈通常在服务端并发连接与 IO。
      # 经验值是 CPU 核数 × 2 + 磁盘数；多实例部署时还要乘以实例数一起评估。
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 3000
      # 必须小于 MySQL 的 wait_timeout（默认 28800s），否则会取到已被服务端关闭的连接
      max-lifetime: 1800000
      pool-name: inkos-hikari
  # Redis：全部 profile 共用一套连接配置，环境变量驱动。
  # 连接是惰性的 —— Redis 没启动时应用照常启动，只有真正操作 Redis 才会失败。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 关闭一级缓存之外的行为保持默认；SQL 日志由 logback 的 com.inkos.mapper 级别控制
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 与 CommonConstants.TOKEN_HEADER / TOKEN_PREFIX 保持一致
  token-name: Authorization
  token-prefix: Bearer
  # 30 天；-1 表示不因闲置而失效
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

springdoc:
  # api-docs.path 与 swagger-ui.path 保持默认（/v3/api-docs、/swagger-ui.html），无需声明
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        # prometheus 供指标抓取；metrics 便于按名字查询；health 用于存活判定
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 基础配置不展开健康详情（默认即 never，适合生产）。
      # 开发环境在 application-dev.yml 里覆盖为 always。
      #
      # 注意：这里不能用 when-authorized —— 它依赖 Spring Security 的 Authentication，
      # 而本项目鉴权走 Sa-Token，Boot 永远拿不到登录态，详情会永远不显示。
      show-details: never

inkos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: true
  cache:
    # 启动预热：把分类树、标签云、首页语句与首屏文章写进 Redis（见 CacheWarmUpRunner）。
    # 预热失败只打日志、不影响启动，因此生产环境也可以安全地保持开启。
    warm-up:
      enabled: true

logging:
  level:
    root: info
    com.inkos: info
