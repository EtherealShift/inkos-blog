server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

spring:
  application:
    name: inkos-blog
  profiles:
    active: dev
  # 个人数据库口令等本地敏感配置。文件不存在时静默跳过，因此可以安全地留在 .gitignore 里。
  config:
    import: optional:classpath:application-local.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      # JDK 21+ 虚拟线程：下游 HTTP 调用这类阻塞等待不再占用平台线程
      enabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 全部 profile 统一使用 MySQL 8。连接信息一律由环境变量驱动，
  # 仓库里不存放任何真实口令（口令走 application-local.yml 或 DB_PASSWORD）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:inkos}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # 连接池不是越大越好：MySQL 的瓶颈通常在服务端并发连接与 IO。
      # 经验值是 CPU 核数 × 2 + 磁盘数；多实例部署时还要乘以实例数一起评估。
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 3000
      # 必须小于 MySQL 的 wait_timeout（默认 28800s），否则会取到已被服务端关闭的连接
      max-lifetime: 1800000
      pool-name: inkos-hikari

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 关闭一级缓存之外的行为保持默认；SQL 日志由 logback 的 com.inkos.mapper 级别控制
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 与 CommonConstants.TOKEN_HEADER / TOKEN_PREFIX 保持一致
  token-name: Authorization
  token-prefix: Bearer
  # 30 天；-1 表示不因闲置而失效
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        # prometheus 供指标抓取；metrics 便于按名字查询；health 用于存活判定
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

inkos:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
    allow-credentials: true

logging:
  level:
    root: info
    com.inkos: info
