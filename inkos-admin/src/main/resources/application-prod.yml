# ============================================================================
# prod：MySQL 8 + Redis。所有敏感信息走环境变量，严禁写入仓库
# ============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:inkos}?useUnicode=true&characterEncoding=utf8&useSSL=true&requireSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:inkos}
    password: ${DB_PASSWORD:}
    hikari:
      # 连接池不是越大越好：MySQL 的瓶颈通常在服务端并发连接与 IO，
      # 经验值是 CPU 核数 × 2 + 磁盘数；多实例部署时还要乘以实例数一起评估。
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
      # 必须小于 MySQL 的 wait_timeout（默认 28800s），否则会取到已被服务端关闭的连接
      max-lifetime: 1800000
      pool-name: inkos-hikari
  sql:
    init:
      # 生产由 Flyway/Liquibase 管理表结构，应用不自动建表
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms

logging:
  level:
    root: warn
    com.inkos: info
