# ============================================================================
# prod：MySQL 8 + Redis。
#
#   数据源继承 application.yml（同样的 DB_HOST / DB_PORT / DB_NAME / DB_USERNAME /
#   DB_PASSWORD 环境变量），本文件只覆盖生产独有的差异。
#
#   连接池按生产规格调整：DB_POOL_SIZE=20（或按 实例数 × (CPU 核数 × 2 + 磁盘数) 估算）。
# ============================================================================
spring:
  sql:
    init:
      # 生产不自动建表：表结构交给 Flyway/Liquibase 或 DBA 流程
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms

logging:
  level:
    root: warn
    com.inkos: info
